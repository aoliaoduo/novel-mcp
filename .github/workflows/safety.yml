name: safety

on:
  push:
  pull_request:
  public:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tree-audit:
    # 公开仓每次 push / PR 都先扫描当前可发布树。
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Scan publishable tree for publication leaks
        run: python3 scripts/public-audit.py

  publication-history-audit:
    # 公开仓每次 push / PR 都扫完整可达历史。这样即使本地 hook 被绕过，
    # “先提交秘密、后续 commit 再删除”的情况也不会只因为当前树干净而静默通过。
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history and commit metadata
        run: python3 scripts/public-audit.py --history

  go-verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race
        run: go test -race ./...
