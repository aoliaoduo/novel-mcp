name: dependabot-auto-merge

on:
  workflow_run:
    workflows:
      - safety
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  merge-patch-updates:
    # workflow_run executes trusted code from the default branch. Never check out
    # or execute code from the Dependabot PR in this privileged workflow.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read PR metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TESTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$TESTED_BRANCH" \
            --json number \
            --jq 'if length == 1 then .[0].number else empty end')
          if [ -z "$PR_NUMBER" ]; then
            echo "pr_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr_found=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json author,body,headRefName,headRefOid,isDraft,mergeStateStatus,state,title \
            > "$RUNNER_TEMP/pr.json"
          author=$(jq -r '.author.login // ""' "$RUNNER_TEMP/pr.json")
          current_head=$(jq -r '.headRefOid // ""' "$RUNNER_TEMP/pr.json")
          if [ "$author" = "app/dependabot" ] || [ "$author" = "dependabot" ]; then
            echo "dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "dependabot=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$TESTED_HEAD" ] && [ "$current_head" = "$TESTED_HEAD" ]; then
            echo "head_matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "head_matches=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify update risk
        if: >-
          steps.metadata.outputs.pr_found == 'true' &&
          steps.metadata.outputs.dependabot == 'true'
        id: classify
        shell: bash
        run: |
          set +e
          python3 scripts/dependabot-auto-merge.py "$RUNNER_TEMP/pr.json"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "auto_merge=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "auto_merge=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Request review for manual or failed Dependabot update
        if: >-
          steps.metadata.outputs.pr_found == 'true' &&
          steps.metadata.outputs.dependabot == 'true' &&
          (github.event.workflow_run.conclusion != 'success' ||
           steps.classify.outputs.auto_merge != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
        shell: bash
        run: |
          gh pr edit "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label manual-review \
            --add-reviewer "$GITHUB_REPOSITORY_OWNER"

      - name: Refresh branch when main advanced
        if: >-
          github.event.workflow_run.conclusion == 'success' &&
          steps.classify.outputs.auto_merge == 'true' &&
          steps.metadata.outputs.head_matches == 'true'
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
        shell: bash
        run: |
          state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" = "BEHIND" ]; then
            gh pr update-branch "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Squash merge verified patch update
        if: >-
          github.event.workflow_run.conclusion == 'success' &&
          steps.classify.outputs.auto_merge == 'true' &&
          steps.metadata.outputs.head_matches == 'true' &&
          steps.refresh.outputs.updated == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
        shell: bash
        run: |
          head_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$head_sha"
