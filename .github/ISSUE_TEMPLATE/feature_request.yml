name: Feature request
description: 提议一个具体、可验证的新能力
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请描述用户问题和期望行为，而不是只给实现方案。
        **不要**粘贴真实 MCP URL、route、Bearer、credentials、私有小说正文、本机绝对路径或内部主机名。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁遇到了什么限制？当前行为为什么不够？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 描述外部可观察行为；可以附示例，但必须使用占位符和脱敏数据。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 主要影响区域
      options:
        - MCP tools / resources / prompts
        - Writing workflow / routing
        - Persistence / recovery
        - HTTP / public access / security
        - TUI / CLI
        - Build / release / developer experience
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: 架构确认
      options:
        - label: 我理解服务器不负责调用模型或执行创作推理；如需求涉及 AI 判断，应由 MCP 客户端完成。
          required: true
        - label: 我已确认本 Issue 不包含真实凭据、私有小说内容或可识别的本机/网络信息。
          required: true
